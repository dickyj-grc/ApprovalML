name: "GitHub MCP Guard"
description: "Classifies a wrapped GitHub MCP server's tools and escalates sensitive calls to approval"
version: "1.0"

# Consumed by approvalml's stdio wrapper: APPROVALML_CONFIG=github-merge-guard.yaml approvalml -- npx -y @modelcontextprotocol/server-github
# Read-only tools pass straight through; everything else falls through to the workflow below.
guards:
  tools:
    "get_*": auto
    "list_*": auto
    "search_*": auto

form:
  fields:
    - name: "request_summary"
      type: "label"
      default_value: "MCP tool call requires approval"

    - name: "tool_name"
      type: "text"
      label: "Tool"
      readonly: true

    - name: "target_branch"
      type: "text"
      label: "Target Branch"
      readonly: true
      calculated: true
      jsonata: "$exists(arguments.base) ? arguments.base : null"

    - name: "risk_amount"
      type: "currency"
      label: "Risk Amount"
      readonly: true
      calculated: true
      jsonata: "$exists(arguments.amount) ? arguments.amount : null"

workflow:
  # Route: merge_pull_request needs owner + reviewer sign-off; a large create_payment
  # call needs a 3-level finance chain; anything else that reached here needs a
  # single sanity-check approval.
  route:
    name: "route"
    type: "conditional_split"
    choices:
      - conditions: "tool_name == 'merge_pull_request'"
        continue_to: "owner_approval"
      - conditions: "tool_name == 'create_payment' and risk_amount > 10000000"
        continue_to: "payment_owner_approval"
    default:
      continue_to: "default_approval"

  # merge_pull_request: owner then reviewer
  owner_approval:
    name: "owner_approval"
    type: "decision"
    description: "Repo Owner Approval"
    approver: "me"
    on_approve:
      continue_to: "reviewer_approval"
    on_reject:
      notify_requestor: "Merge denied by repo owner"
      end_workflow: true

  reviewer_approval:
    name: "reviewer_approval"
    type: "decision"
    description: "Reviewer Approval"
    approver: "reviewer"
    on_approve:
      continue_to: "done"
    on_reject:
      notify_requestor: "Merge denied by reviewer"
      end_workflow: true

  # create_payment over 10,000,000: owner -> finance -> director
  payment_owner_approval:
    name: "payment_owner_approval"
    type: "decision"
    description: "Owner Sign-off"
    approver: "me"
    on_approve:
      continue_to: "finance_approval"
    on_reject:
      notify_requestor: "Payment denied by owner"
      end_workflow: true

  finance_approval:
    name: "finance_approval"
    type: "decision"
    description: "Finance Approval"
    approver: "finance"
    on_approve:
      continue_to: "director_approval"
    on_reject:
      notify_requestor: "Payment denied by finance"
      end_workflow: true

  director_approval:
    name: "director_approval"
    type: "decision"
    description: "Director Approval"
    approver: "director"
    on_approve:
      continue_to: "done"
    on_reject:
      notify_requestor: "Payment denied by director"
      end_workflow: true

  # Any other gated tool call: a single sanity-check approval
  default_approval:
    name: "default_approval"
    type: "decision"
    description: "Owner Sanity Check"
    approver: "me"
    on_approve:
      continue_to: "done"
    on_reject:
      notify_requestor: "Request denied"
      end_workflow: true

  done:
    name: "done"
    type: "end"
    notify_requestor: "MCP tool call approved — retry the call to forward it to GitHub"
